<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#f5ece8">
    <meta
            name="description"
            content="Фотографии свадьбы Игоря и Алины — 20 июня 2026 года."
    >
    <title>💍 Игорь & Алина — наша свадьба</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css"
    >
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/solid.min.css"
    >
    <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Caveat:wght@500;600&family=Jost:wght@300;400;500&display=swap"
            rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <header class="gallery-header">
        <h1>Igor <span>&</span> Alina</h1>

        <p class="wedding-date">20 ИЮНЯ 2026</p>

    </header>

    <main id="moments">
        <section
                id="gallery"
                class="gallery"
                aria-label="Фотографии свадьбы Игоря и Алины"
        ></section>

        <div id="gallery-loading" class="gallery-loading" aria-live="polite">
            <span class="loader" aria-hidden="true"></span>
            <p>Собираем наши воспоминания…</p>
        </div>
    </main>

    <footer class="gallery-footer">
        <p class="footer-script">СПАСИБО ВСЕМ ЗА ЭТОТ ДЕНЬ :)</p>
        <span class="footer-date">20 · 06 · 2026</span>
    </footer>

</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Закрыть фото">
        <span></span>
        <span></span>
    </button>

    <button id="share-photo" class="lightbox-share" type="button" aria-label="Поделиться фотографией" title="Поделиться">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m-5 5 5-5 5 5M5 13v6h14v-6" />
        </svg>
    </button>

    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Предыдущее фото">
        <span></span>
    </button>

    <div class="lightbox-content">
        <div class="lightbox-photo-wrapper">
            <img id="lightbox-image" src="" alt="">
            <p id="lightbox-error" class="lightbox-error hidden" aria-live="polite">
                Не удалось загрузить фотографию.
            </p>
            <div id="lightbox-loader" class="lightbox-loader" aria-hidden="true">
                <span class="loader"></span>
            </div>
        </div>

        <div class="lightbox-info">
            <div class="photo-counter" aria-live="polite">
                <span class="counter-label">кадр</span>
                <span id="current-photo">1</span>
                <span class="counter-divider">из</span>
                <span id="total-photos">…</span>
            </div>

            <div class="download-actions">
                <a id="download-big" class="download-button download-primary" href="#">
                    <i class="fa-solid fa-download download-icon" aria-hidden="true"></i>
                    <span class="download-button-text">
                        <span>Скачать оригинал</span>
                        <span id="download-big-size" class="download-size"></span>
                    </span>
                </a>
                <a id="download-small" class="download-button" href="#">
                    <i class="fa-solid fa-download download-icon" aria-hidden="true"></i>
                    <span class="download-button-text">
                        <span>Скачать уменьшенную копию</span>
                        <span id="download-small-size" class="download-size"></span>
                    </span>
                </a>
            </div>
        </div>
    </div>

    <button class="lightbox-nav lightbox-next" type="button" aria-label="Следующее фото">
        <span></span>
    </button>
</div>

<div id="share-status" class="share-status" role="status" aria-live="polite"></div>

<script src="script.js"></script>

</body>
</html>
